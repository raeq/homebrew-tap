name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - name: Tap this checkout
      run: |
        brew tap-new raeq/tap --no-git || true
        cp Formula/*.rb "$(brew --repository)/Library/Taps/raeq/homebrew-tap/Formula/"
    - name: Audit
      run: brew audit --strict --online --formula raeq/tap/ibook2epub
    - name: Install from source
      run: brew install --formula --build-from-source raeq/tap/ibook2epub
    # The formula's own test block converts a real package directory and runs
    # --verify over the result, so a release that cannot convert fails here
    # rather than on somebody's shelf.
    - name: Test
      run: brew test raeq/tap/ibook2epub
